name: write_file
description: Write text content to a file. Creates parent directories if needed.
parameters:
  type: object
  properties:
    file_path:
      type: string
      description: Absolute path to write to
    content:
      type: string
      description: Text content to write
    mode:
      type: string
      description: '''w'' to overwrite, ''a'' to append'
      default: w
  required:
  - file_path
  - content

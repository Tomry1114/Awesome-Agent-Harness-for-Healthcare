# Search blocklist: pages a web search must never return, because they are the benchmark's own source or the material
# a benchmark item was taken from. Without it a search can retrieve the gold answer and a score gain means nothing.
# This file is configuration data only; runner/search_guard.py reads it and the filtering is hard-wired there
# (there is no switch that turns it off). One section per benchmark, keyed by the benchmark name the environment
# passes to the guard.
#
# Each section has three benchmark-level rule lists (blocked_reason benchmark_dataset_source) and a per-item table,
# `items` (blocked_reason benchmark_provenance_source, described above the MedCTA table). Every benchmark-level rule has
# an `id` (what a blocked record names) and a `why`.
#
#   refuse_query   regex over the query text. A query that explicitly targets the benchmark source is refused before
#                  the search runs; the agent sees a refusal, not results.
#   urls           a result link. `hosts` matches the link host or any subdomain of it (a leading "www." is ignored).
#                  `path` / `query` are regexes searched in the link's path / query string; a rule with both needs
#                  both. A rule with `hosts: ["*"]` applies to every host.
#   text           regex over a result's title, snippet and rendered line. Identifiers only (the dataset id, the
#                  paper's name, title and arXiv id, the dataset row serialization), never topic keywords, so an
#                  ordinary medical page stays searchable (runner/tests/test_search_guard.py checks that).
#
#   items          task id -> that item's direct material provenance (the article holding the item's original image
#                  or figure, that figure or caption page, the article's supplement). Applied on that item's task only.
#                  Empty when the benchmark has no item table.
#
# Regexes are Python `re` patterns; `flags: i` makes one case-insensitive.

MedCTA:
  sources:
    - "HF dataset   https://huggingface.co/datasets/IVUL-KAUST/MedCTA (benchmark/MedCTA/README.md; task.json context.images[].source_dataset)"
    - "paper        arXiv 2606.11702, 'MedCTA: A Benchmark for Clinical Tool Agents' (benchmark/MedCTA/README.md citation)"
    - "project page https://ivul-kaust.github.io/MedCTA/ (benchmark/MedCTA/README.md)"
    - "code repo    github.com/IVUL-KAUST/MedCTA (inferred from the project page's GitHub Pages owner; not linked in the README)"
  refuse_query:
    - id: benchmark_name
      pattern: '\bmedcta\b'
      flags: i
      why: the benchmark's own name
    - id: dataset_owner
      pattern: '\bivul[\s_-]*kaust\b'
      flags: i
      why: the dataset's Hugging Face / GitHub owner (IVUL-KAUST/MedCTA)
    - id: paper_arxiv_id
      pattern: '\b2606\.11702\b'
      why: the paper's arXiv id
    - id: paper_title
      pattern: 'benchmark\s+for\s+clinical\s+tool[\s-]+agents'
      flags: i
      why: the paper's title
  urls:
    - id: hf_dataset_url
      hosts: [huggingface.co, hf.co, hf-mirror.com]
      path: '^/(?:api/)?datasets/ivul-kaust/medcta(?:[/.?#]|$)'
      flags: i
      why: dataset card, viewer, files, discussions, parquet conversion and API of the dataset, and its hf-mirror copy
    - id: hf_dataset_server
      hosts: [datasets-server.huggingface.co]
      query: '(?:^|&)dataset=ivul-kaust(?:/|%2f)medcta(?:&|$)'
      flags: i
      why: the dataset viewer's row API (/rows, /first-rows, /search)
    - id: github_repo
      hosts: [github.com, raw.githubusercontent.com, codeload.github.com]
      path: '^/ivul-kaust/medcta(?:[/.?#]|$)'
      flags: i
      why: the benchmark's code repository
    - id: project_page
      hosts: [ivul-kaust.github.io]
      path: '^/medcta(?:[/.?#]|$)'
      flags: i
      why: the benchmark's project page
    - id: paper_arxiv_id_url
      hosts: ["*"]
      path: '(?:^|[/=_-])2606\.11702(?:v\d+)?(?:[/.?#_-]|$)'
      why: the paper under its arXiv id on any host (arxiv.org abs/pdf/html, export.arxiv.org, alphaxiv, huggingface.co/papers, semantic scholar /arxiv/, emergentmind, papers.cool)
    - id: paper_arxiv_id_query
      hosts: ["*"]
      query: '(?:^|[=&])(?:arxiv:)?2606\.11702(?:v\d+)?(?:&|$)'
      flags: i
      why: the paper under its arXiv id in a query string (arxiv-sanity style ?id=)
    - id: paper_slug_semanticscholar
      hosts: [semanticscholar.org]
      path: '^/paper/medcta(?:[-/%]|$)'
      flags: i
      why: semantic scholar page slugged by the paper title
    - id: paper_slug_paperswithcode
      hosts: [paperswithcode.com]
      path: '^/(?:paper|dataset)/medcta(?:[-/]|$)'
      flags: i
      why: papers with code paper / dataset page
    - id: paper_slug_researchgate
      hosts: [researchgate.net]
      path: '^/publication/\d+_medcta(?:[_/]|$)'
      flags: i
      why: researchgate publication page
  text:
    - id: hf_dataset_id
      pattern: '\bivul[\s_-]*kaust\s*/\s*medcta\b'
      flags: i
      why: 'the dataset id; seen in every leaked dataset result in recorded runs ("IVUL-KAUST/MedCTA · Datasets at Hugging Face")'
    - id: paper_title
      pattern: 'benchmark\s+for\s+clinical\s+tool[\s-]+agents'
      flags: i
      why: 'the paper title; seen in recorded runs ("MedCTA: A Benchmark for Clinical Tool Agents")'
    - id: benchmark_name
      pattern: '\bMedCTA\b'
      flags: i
      why: the benchmark's coined name, on a mirror or a page quoting it
    - id: paper_arxiv_id
      pattern: '\b2606\.11702\b'
      why: the paper's arXiv id quoted in a snippet
    - id: dataset_row_tool_list
      pattern: '\[\s*"(?:OCR|ImageDescription|RegionAttributeDescription|GoogleSearch|Calculator)"'
      why: 'the dataset row serialization of its tools column ([ "OCR", "ImageDescription" ]), seen in leaked rows; also used by GTA, the parent tool benchmark (not a medical page)'
    - id: dataset_row_tool_chain
      pattern: '\b(?:OCR|ImageDescription|RegionAttributeDescription|GoogleSearch|Calculator)\s*->\s*(?:OCR|ImageDescription|RegionAttributeDescription|GoogleSearch|Calculator)\b'
      why: 'the dataset row serialization of its tool chain column (OCR -> ImageDescription), seen in leaked rows'
    - id: paper_example_tools
      pattern: '\bInvolved Tools:\s*(?:OCR|ImageDescription|RegionAttributeDescription|GoogleSearch|Calculator)\b'
      why: 'the paper appendix example format ("Involved Tools: ImageDescription, GoogleSearch"), seen in recorded runs'
  # Per-item provenance table: what each item was taken from. Read by runner/search_guard.py only; nothing of it
  # reaches the agent, the harness context, the ledger or an observation. Every MedCTA task id has an entry.
  #   status      known: the item's source article is established (ids required); unknown: not established,
  #               nothing is blocked for the item (evidence says what was checked; note names a near miss)
  #   ids         pmcid / pmid / doi. The guard turns each into rules: the PMCID or DOI in any link's path or
  #               query and in a snippet; the PMID as a path segment or query value on ncbi.nlm.nih.gov /
  #               europepmc.org / ebi.ac.uk and as 'PMID <n>' in a snippet; each also refuses a query that
  #               contains it literally
  #   text        item_title (field: title, anchored at the start of a result's title), item_byline (the
  #               engine's scholarly byline plus a topic word, `also`), item_figure_caption (the item's figure
  #               caption opening, anywhere in a result), item_article_figure (the first sentence of each
  #               figure caption of the article, anchored at the start of a title: its figure pages)
  #   pages       example pages of the article, its figure page and its supplement (PMC serves the article's
  #               files under /bin/); URL forms, not fetched. runner/tests/test_search_guard.py checks each is
  #               withheld on the item's task and kept on another
  #   lookups     the NCBI E-utilities URLs that resolved the ids and the figure captions (free metadata)
  #   evidence    for unknown items: dataset_metadata_checked = no source, credit, reference or id field in
  #               tasks_unified.jsonl or the train.parquet columns, image files named image_<n>, and no source
  #               named in the embedded image metadata; recorded_results_checked = no search result line in the
  #               recorded reference runs was established as the item's source (candidate screens + NCBI
  #               caption sweep)
